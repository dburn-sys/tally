# CI for Tally (architecture rule E-6): the full test suite and a secret scan on
# every push. Pin each action to a commit SHA before relying on this in
# production: gh api repos/<owner>/<action>/git/ref/tags/<tag> --jq .object.sha
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tally
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tally_app:tally_app@localhost:5432/tally
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tally
      TALLY_APP_PASSWORD: tally_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run migrate
      - run: npm test

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 \
            git /repo --redact --verbose --exit-code 1

  # Chapter 20: verify the Gantry paper trail on the server, for every commit,
  # whatever tool made it. Set the repository variable GANTRY_REPO (owner/gantry).
  gantry-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.GANTRY_REPO }}
          path: .gantry-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gantry-check
        id: check
        run: |
          base=""
          if [ -n "${GITHUB_BASE_REF:-}" ]; then base="--base origin/$GITHUB_BASE_REF"; fi
          # shellcheck disable=SC2086
          python .gantry-tools/ci/gantry_check.py --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" $base
      - name: Label PRs that didn't go through Gantry (Chapter 23)
        if: github.event_name == 'pull_request' && steps.check.outputs.no_gantry_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --add-label no-gantry-run

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Base images pinned by digest (E-1)
        run: ./scripts/check-image-pins.sh Dockerfile
